name: C/C++ CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          libssl-dev \
          qt6-base-dev

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -S ${{github.workspace}}/Crypt -DCMAKE_BULD_TYPE=${{matrix.build_type}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.build_type}} -j $(nproc)

    - name: Test CLI (smoke)
      run: test -f ${{github.workspace}}/build/crypt-cli

    - name: Test GUI (headless)
      run: |
        export QT_QPA_PLATFORM=offscreen
        timeout 5s ${{github.workspace}}/build/crypt-gui || test $? -eq 124